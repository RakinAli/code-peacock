# Peacock — autonomous PR pipeline, headless in CI.
# Copy this file to .github/workflows/peacock.yml in YOUR project.
#
# Setup:
#   1. Add repo secret ANTHROPIC_API_KEY (Option A) or OPENAI_API_KEY (Option B).
#   2. STRONGLY RECOMMENDED: add secret PEACOCK_GH_TOKEN — a fine-grained PAT (or
#      GitHub App token) with contents+pull-requests write, and NO admin. Pushes
#      made with the default GITHUB_TOKEN do not trigger workflows, so without a
#      PAT your own CI will not re-run on peacock's fix commits and the babysit
#      loop can't see green. Keep it non-admin so it cannot bypass the branch
#      protection below.
#   3. REQUIRED backstop — branch protection: protect your default AND release
#      branches to require human approval before any merge. This is mandatory, not
#      optional. This per-PR path has no merge kill-switch (that shim only guards
#      the autopilot runner), so a write-scoped token could technically merge;
#      branch protection is what actually guarantees nothing automated ever merges.
#   4. If UI capture needs your app to boot (DB URL, env vars), add them to the
#      run step's `env` and make sure the dev server starts in CI.
#   5. Optional: commit a peacock.config.json at your repo root (see README).
#
# Triggers: every same-repo PR update, plus a comment starting with "peacock" from a
# repo owner/member/collaborator. Fork PRs are skipped on purpose: they run without
# secrets and a read-only token, and letting a comment start an autonomous agent on
# untrusted code would hand that code your secrets.

name: peacock
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: peacock-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  peacock:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, 'peacock') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          fetch-depth: 0
          token: ${{ secrets.PEACOCK_GH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Option A: Claude Code ──────────────────────────────────────────────
      - name: Run peacock (Claude Code)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PEACOCK_GH_TOKEN || github.token }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add RakinAli/code-peacock
          claude plugin install code-peacock@code-peacock --scope user
          # Put the merge kill-switch on PATH for this run too. Without it the
          # per-PR CI path had no mechanical guard — only the behavioral rule and
          # branch protection. The shim refuses every gh/git merge vector.
          git clone --depth 1 https://github.com/RakinAli/code-peacock /tmp/code-peacock
          source /tmp/code-peacock/scripts/merge-killswitch.sh
          peacock_install_killswitch "$RUNNER_TEMP/peacock-shim"
          claude -p "/peacock $PR_NUMBER" --dangerously-skip-permissions

      # ── Option B: Codex CLI (delete Option A and uncomment) ───────────────
      # - name: Run peacock (Codex)
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #     GH_TOKEN: ${{ secrets.PEACOCK_GH_TOKEN || github.token }}
      #   run: |
      #     npm install -g @openai/codex
      #     git clone --depth 1 https://github.com/RakinAli/code-peacock /tmp/code-peacock
      #     bash /tmp/code-peacock/scripts/install-codex.sh
      #     # Same merge kill-switch as Option A — block every gh/git merge vector.
      #     source /tmp/code-peacock/scripts/merge-killswitch.sh
      #     peacock_install_killswitch "$RUNNER_TEMP/peacock-shim"
      #     codex exec --full-auto --skip-git-repo-check \
      #       "$(cat ~/.codex/prompts/peacock.md)

      #        Run in PR mode on PR #$PR_NUMBER."

      # The pipeline's report is useful even when the run fails partway. Known
      # secret env values are redacted from evidence logs by project-checks.mjs.
      # Commands must not print encoded or transformed secrets.
      # .peacock/auth/ (credentials, browser session) is deliberately not uploaded.
      - name: Upload report + captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peacock-report-pr-${{ env.PR_NUMBER }}
          path: |
            .peacock/reports/
            .peacock/captures/
            .peacock/evidence/
            !.peacock/**/auth/**
            !.peacock/**/storage-state.json
          if-no-files-found: ignore
