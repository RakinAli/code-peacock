# Peacock — autonomous PR pipeline, headless in CI.
# Copy this file to .github/workflows/peacock.yml in YOUR project.
#
# Setup:
#   1. Add repo secret ANTHROPIC_API_KEY (Option A) or OPENAI_API_KEY (Option B).
#   2. If UI capture needs your app to boot (DB URL, env vars), add them to the
#      run step's `env` and make sure the dev server starts in CI.
#   3. Optional: commit a peacock.config.json at your repo root (see README).
#
# Triggers: every PR update, plus commenting "peacock" on a PR re-runs it.

name: peacock
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: peacock-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  peacock:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'peacock'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Option A: Claude Code ──────────────────────────────────────────────
      - name: Run peacock (Claude Code)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add RakinAli/code-peacock
          claude plugin install code-peacock@code-peacock --scope user
          claude -p "/peacock $PR_NUMBER" --dangerously-skip-permissions

      # ── Option B: Codex CLI (delete Option A and uncomment) ───────────────
      # - name: Run peacock (Codex)
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     npm install -g @openai/codex
      #     git clone --depth 1 https://github.com/RakinAli/code-peacock /tmp/code-peacock
      #     bash /tmp/code-peacock/scripts/install-codex.sh
      #     codex exec --full-auto --skip-git-repo-check \
      #       "$(cat ~/.codex/prompts/peacock.md)

      #        Run in PR mode on PR #$PR_NUMBER."

      # The pipeline's report is useful even when the run fails partway.
      - name: Upload report + captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peacock-report-pr-${{ env.PR_NUMBER }}
          path: |
            .peacock/reports/
            .peacock/captures/
          if-no-files-found: ignore
